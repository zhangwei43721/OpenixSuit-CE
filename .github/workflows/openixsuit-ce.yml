name: OpenixSuit-CE Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'openixsuit-ce-v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPENIXSUIT_RELEASE_REPO: ${{ github.repository }}

jobs:
  check:
    name: Check desktop code (Linux)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - &setup_node
        name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag and desktop version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(node -p "require('./OpenixSuit-CE/src-tauri/tauri.conf.json').version")
          if [[ ! "$GITHUB_REF_NAME" =~ ^openixsuit-ce-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid desktop release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "openixsuit-ce-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-desktop-check-${{ hashFiles('OpenixSuit-CE/src-tauri/Cargo.toml', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-check-

      - name: Install Linux system dependencies
        run: &install_linux_dependencies |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            pkg-config

      - &install_frontend_dependencies
        name: Install frontend dependencies
        working-directory: OpenixSuit-CE
        run: npm ci

      - name: Build desktop frontend
        working-directory: OpenixSuit-CE
        run: npm run build

      - name: Run desktop Rust tests
        run: cargo test --manifest-path OpenixSuit-CE/src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_type == 'tag' && needs.check.result == 'success'))
    runs-on: ${{ matrix.runner }}
    env:
      DESKTOP_RELEASE: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - *setup_node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenixSuit-CE/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-suit-${{ hashFiles('OpenixSuit-CE/src-tauri/Cargo.lock', 'OpenixSuit-CE/src-tauri/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-suit-

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: *install_linux_dependencies

      - name: Install macOS dependencies
        if: matrix.runner == 'macos-latest'
        run: brew install libusb

      - name: Install Windows dependencies
        if: matrix.runner == 'windows-latest'
        run: |
          vcpkg install libusb:x64-windows
          vcpkg integrate install

      - *install_frontend_dependencies

      - name: Configure desktop updater
        working-directory: OpenixSuit-CE
        shell: bash
        env:
          OPENIXSUIT_UPDATER_PUBLIC_KEY: ${{ vars.OPENIXSUIT_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ "$DESKTOP_RELEASE" != true ]]; then
            printf '{}\n' > desktop-updater.conf.json
            exit 0
          fi
          if [[ -z "$OPENIXSUIT_UPDATER_PUBLIC_KEY" ]]; then
            echo "Configure OPENIXSUIT_UPDATER_PUBLIC_KEY before publishing." >&2
            exit 1
          fi
          node -e 'require("node:fs").writeFileSync("desktop-updater.conf.json", JSON.stringify({
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: process.env.OPENIXSUIT_UPDATER_PUBLIC_KEY.trim() } }
          }))'

      - name: Compile desktop binaries
        working-directory: OpenixSuit-CE
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle --config desktop-updater.conf.json

      - name: Prepare bundled USB libraries
        working-directory: OpenixSuit-CE/src-tauri
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_dir="target/$DESKTOP_TARGET/release"
          case "$RUNNER_OS" in
            Windows)
              libusb="$release_dir/libusb-1.0.dll"
              if [[ ! -f "$libusb" ]]; then
                vcpkg_root=$(cygpath -u "$VCPKG_INSTALLATION_ROOT")
                cp "$vcpkg_root/installed/x64-windows/bin/libusb-1.0.dll" "$libusb"
              fi
              printf '{"bundle":{"resources":{"%s/libusb-1.0.dll":"libusb-1.0.dll"}}}\n' \
                "$release_dir" > ../desktop-runtime.conf.json
              ;;
            macOS)
              libusb=$(otool -L "$release_dir/openixsuit-ce" | awk '$1 ~ /\/libusb-1[.]0([.][0-9]+)?[.]dylib$/ {print $1}')
              test -f "$libusb"
              libusb_name="${libusb##*/}"
              cp "$libusb" "$release_dir/$libusb_name"
              for binary in openixsuit-ce openixsuit-ai; do
                install_name_tool -change "$libusb" "@loader_path/../Frameworks/$libusb_name" "$release_dir/$binary"
              done
              printf '{"bundle":{"macOS":{"frameworks":["%s/%s"],"signingIdentity":"-"}}}\n' \
                "$release_dir" "$libusb_name" > ../desktop-runtime.conf.json
              ;;
            Linux)
              printf '{}\n' > ../desktop-runtime.conf.json
              ;;
          esac

      - name: Bundle desktop installers
        working-directory: OpenixSuit-CE
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.DESKTOP_RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.DESKTOP_RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "$DESKTOP_RELEASE" == true && -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing." >&2
            exit 1
          fi
          npm run tauri -- bundle --target ${{ matrix.target }} \
            --config desktop-updater.conf.json --config desktop-runtime.conf.json

      - name: Verify bundled macOS executables
        if: matrix.platform == 'macos-arm64'
        working-directory: OpenixSuit-CE/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/OpenixSuit-CE.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/openixsuit-ce" ai --help
          "$app/Contents/MacOS/openixsuit-ai" --help

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openixsuit-ce-${{ matrix.platform }}
          path: |
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
          if-no-files-found: error

  release-upload:
    name: Upload Desktop Release Assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate static updater manifest
        run: |
          python3 scripts/generate-openixsuit-update-manifest.py \
            --artifacts artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${GITHUB_REF_NAME#openixsuit-ce-v}" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output artifacts/openixsuit-ce-update.json
      - name: Upload assets to desktop GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
