name: OpenixSuit-CE Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'openixsuit-ce-v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OPENIXSUIT_RELEASE_REPO: ${{ github.repository }}

jobs:
  validate-release:
    name: Validate desktop release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check tag and desktop version
        run: |
          set -euo pipefail
          version=$(node -p "require('./OpenixSuit-CE/src-tauri/tauri.conf.json').version")
          if [[ ! "$GITHUB_REF_NAME" =~ ^openixsuit-ce-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid desktop release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "openixsuit-ce-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop version $version" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: [validate-release]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.validate-release.result == 'success')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenixSuit-CE/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-suit-${{ hashFiles('OpenixSuit-CE/src-tauri/Cargo.lock', 'OpenixSuit-CE/src-tauri/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-suit-

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            pkg-config

      - name: Install macOS dependencies
        if: matrix.runner == 'macos-latest'
        run: brew install libusb

      - name: Install Windows dependencies
        if: matrix.runner == 'windows-latest'
        run: |
          vcpkg install libusb:x64-windows
          vcpkg integrate install

      - name: Install frontend dependencies
        working-directory: OpenixSuit-CE
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build unsigned artifacts
        if: github.event_name == 'workflow_dispatch'
        working-directory: OpenixSuit-CE
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Build signed updater artifacts
        if: github.event_name == 'push'
        working-directory: OpenixSuit-CE
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENIXSUIT_UPDATER_PUBLIC_KEY: ${{ vars.OPENIXSUIT_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$OPENIXSUIT_UPDATER_PUBLIC_KEY" ]]; then
            echo "Configure TAURI_SIGNING_PRIVATE_KEY and OPENIXSUIT_UPDATER_PUBLIC_KEY before publishing." >&2
            exit 1
          fi
          node -e 'require("node:fs").writeFileSync("desktop-updater.conf.json", JSON.stringify({
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { pubkey: process.env.OPENIXSUIT_UPDATER_PUBLIC_KEY.trim() } }
          }))'
          npm run tauri -- build --target ${{ matrix.target }} --config desktop-updater.conf.json

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openixsuit-ce-${{ matrix.platform }}
          path: |
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
          if-no-files-found: error

  release-upload:
    name: Upload Desktop Release Assets
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate static updater manifest
        run: |
          python3 scripts/generate-openixsuit-update-manifest.py \
            --artifacts artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${GITHUB_REF_NAME#openixsuit-ce-v}" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output artifacts/openixsuit-ce-update.json
      - name: Upload assets to desktop GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
