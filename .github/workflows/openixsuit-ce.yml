name: OpenixSuit-CE Build

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenixSuit-CE/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-suit-${{ hashFiles('OpenixSuit-CE/src-tauri/Cargo.lock', 'OpenixSuit-CE/src-tauri/Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-suit-

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            pkg-config

      - name: Install macOS dependencies
        if: matrix.runner == 'macos-latest'
        run: brew install libusb

      - name: Install Windows dependencies
        if: matrix.runner == 'windows-latest'
        run: |
          vcpkg install libusb:x64-windows
          vcpkg integrate install

      - name: Install frontend dependencies
        working-directory: OpenixSuit-CE
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build OpenixSuit-CE
        working-directory: OpenixSuit-CE
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openixsuit-ce-${{ matrix.platform }}
          path: |
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            OpenixSuit-CE/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
          if-no-files-found: warn

  release-upload:
    name: Upload Release Assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
