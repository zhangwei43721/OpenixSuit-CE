[package]
name = "openixsuit-ce"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Allwinner firmware flashing and debugging tool"
default-run = "openixsuit-ce"

[lib]
name = "openixsuit_ce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openixsuit-ce"
path = "src/main.rs"

[[bin]]
name = "openixsuit-ai"
path = "src/bin/openixsuit-ai.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.1"
bindgen = "0.70"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
rusb = "0.9"
capstone = "0.12"
adb_client = "2"
fdt = "0.1"
gptman = "1"
mbrman = "0.5"
dirs = "5"
crc32fast = "1.5"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
